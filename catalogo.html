<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo de Vinhos - Fellype & Hwlly</title>
    <meta name="description" content="Explore nossa lista completa com mais de 130 vinhos degustados. Filtre por país, uva ou vinícola.">
    <meta property="og:title" content="Nossa Adega Digital - Catálogo Completo">
    <meta property="og:description" content="Explore nossa lista completa com mais de 95 vinhos degustados.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fellypehwlly-adega.space/catalogo.html">
    <link rel="canonical" href="https://fellypehwlly-adega.space/catalogo.html">
    <meta property="og:image" content="https://fellypehwlly-adega.space/assets/og-image.png">
    <meta property="og:locale" content="pt_BR">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#15100f">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-180.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="shared.css">

    <style>
        /* --- CABEÇALHO --- */
        .search-section {
            padding: 65px 20px 15px;
            text-align: center;
            background: linear-gradient(to bottom, #1c1413, var(--bg));
        }

        .search-section h1 {
            color: var(--dourado);
            font-size: 2rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }

        .search-section h1::after {
            content: '';
            display: block;
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--dourado), transparent);
            margin: 12px auto 0;
        }

        .search-section p.sub-titulo {
            color: var(--subtexto);
            font-size: 0.88rem;
            font-style: italic;
            margin-bottom: 28px;
            margin-top: 16px;
            opacity: 0.8;
            font-family: 'Outfit', sans-serif;
        }

        .search-container { position: relative; max-width: 580px; margin: 0 auto 20px; }
        .search-container i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--dourado); opacity: 0.7; }

        #search {
            width: 100%;
            padding: 14px 20px 14px 54px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: var(--texto);
            outline: none;
            transition: var(--transicao);
            font-size: 0.92rem;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.3px;
        }
        #search::placeholder { color: #7b6e68; }
        #search:focus { border-color: rgba(198, 161, 91, 0.4); background: rgba(255, 255, 255, 0.04); }

        /* --- FILTROS --- */
        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 0 20px 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #a0938c;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transicao);
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .filter-chip:hover { border-color: rgba(198, 161, 91, 0.4); color: var(--dourado-claro); }
        .filter-chip.active {
            background: linear-gradient(135deg, var(--vinho-vivo), var(--vinho-escuro));
            border-color: rgba(198, 161, 91, 0.2);
            color: rgba(255, 255, 255, 0.9);
        }

        .sort-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 0 20px 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            color: #7b6e68;
            letter-spacing: 0.5px;
        }

        .sort-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #8a7d76;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transicao);
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .sort-btn:hover { border-color: rgba(198, 161, 91, 0.4); color: var(--dourado); }
        .sort-btn.active { border-color: rgba(198, 161, 91, 0.4); color: var(--dourado); background: rgba(198, 161, 91, 0.06); }

        /* --- GRID E CARDS --- */
        .vinho-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 20px 5% 70px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .vinho-card {
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transicao);
            cursor: pointer;
            box-shadow: var(--sombra-card);
        }
        .vinho-card:hover {
            transform: translateY(-7px);
            border-color: rgba(198, 161, 91, 0.3);
            box-shadow: var(--sombra-hover);
        }

        .vinho-img-container { width: 100%; aspect-ratio: 4 / 5; background: var(--card-alt); overflow: hidden; }
        .vinho-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .vinho-card:hover .vinho-img { transform: scale(1.04); }

        .vinho-info { padding: 20px; }

        .vinho-nome {
            font-size: 1rem;
            color: var(--dourado-claro);
            margin: 0 0 6px 0;
            font-family: 'Cinzel', serif;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .vinho-data {
            font-size: 0.72rem;
            color: #7b6e68;
            display: block;
            margin-bottom: 12px;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
        }

        .vinho-detalhes {
            font-size: 0.82rem;
            color: var(--subtexto);
            margin-bottom: 18px;
            line-height: 1.6;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .vinho-detalhes i { color: var(--dourado); width: 14px; opacity: 0.85; }
        .vinho-flag-icon { width: 16px; height: 11px; object-fit: cover; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

        .notas {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
        }

        .nota-box { text-align: center; flex: 1; }

        .nota-box span {
            display: block;
            font-size: 0.58rem;
            color: #7b6e68;
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .nota-valor {
            color: var(--dourado);
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Cinzel', serif;
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--subtexto);
            font-family: 'Outfit', sans-serif;
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 2.5rem; color: #372e2b; margin-bottom: 18px; display: block; }
        .empty-state h3 { color: #6a5d57; font-size: 1rem; margin: 0 0 8px; font-weight: 400; font-family: 'Cinzel', serif; letter-spacing: 1px; }
        .empty-state p { margin: 0; font-size: 0.85rem; color: #7b6e68; }

        .btn-limpar {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 22px;
            border: 1px solid rgba(198, 161, 91, 0.4);
            color: var(--dourado);
            border-radius: 20px;
            font-size: 0.72rem;
            cursor: pointer;
            background: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-limpar:hover { background: var(--dourado); color: #000; }

        /* --- SKELETON --- */
        .skeleton-card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.04); }
        .sk-img { aspect-ratio: 4 / 5; }
        .sk-body { padding: 20px; }
        .sk-line { height: 13px; border-radius: 4px; margin-bottom: 10px; }
        .sk-line.short { width: 40%; }
        .sk-line.med { width: 70%; }

        /* --- RESULTADO COUNT --- */
        .result-count {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            color: #7b6e68;
            letter-spacing: 1px;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        /* --- ALTERNÂNCIA DE VISUALIZAÇÃO --- */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 20px 18px;
        }

        .view-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--subtexto);
            padding: 9px 18px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transicao);
        }
        .view-btn:hover { border-color: rgba(198, 161, 91, 0.4); color: var(--dourado-claro); }
        .view-btn.active {
            background: linear-gradient(135deg, var(--vinho-vivo), var(--vinho-escuro));
            border-color: rgba(198, 161, 91, 0.2);
            color: rgba(255, 255, 255, 0.92);
        }

        /* --- LINHA DO TEMPO --- */
        .timeline-container { max-width: 720px; margin: 0 auto; padding: 6px 5% 70px; }

        .timeline-month { margin-bottom: 34px; }

        .timeline-month-label {
            font-family: 'Cinzel', serif;
            color: var(--dourado);
            font-size: 0.98rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin: 0 0 18px;
            padding-left: 40px;
            position: relative;
        }
        .timeline-month-label::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--dourado);
            box-shadow: 0 0 0 4px rgba(198, 161, 91, 0.15);
        }

        .timeline-track {
            position: relative;
            padding-left: 40px;
            margin-left: 11px;
            border-left: 2px solid rgba(198, 161, 91, 0.16);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -46px;
            top: 26px;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(198, 161, 91, 0.55);
        }

        .timeline-card {
            display: flex;
            gap: 14px;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px;
            transition: var(--transicao);
        }
        .timeline-card:hover {
            border-color: rgba(139, 0, 32, 0.4);
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(4px);
        }

        .timeline-img { width: 58px; height: 58px; border-radius: 10px; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        .timeline-info { flex: 1; min-width: 0; }
        .timeline-date {
            font-size: 0.66rem;
            color: var(--subtexto);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Outfit', sans-serif;
        }
        .timeline-nome {
            font-family: 'Cinzel', serif;
            color: var(--texto);
            font-size: 0.9rem;
            font-weight: 500;
            margin: 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .timeline-meta { font-size: 0.75rem; color: var(--subtexto); font-family: 'Outfit', sans-serif; }
        .timeline-nota { font-family: 'Cinzel', serif; color: var(--dourado); font-weight: 600; font-size: 1.15rem; flex-shrink: 0; }

        @media (max-width: 992px) {
            .search-section { padding: 45px 15px 10px; }
            .search-section h1 { font-size: 1.7rem; }
            .vinho-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); padding: 20px 4%; gap: 16px; }
            .vinho-img-container { aspect-ratio: 4 / 5; }
        }

        @media (max-width: 768px) {
            .search-section h1 { font-size: 1.4rem; }
            .vinho-grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 4%; }
            .filter-chip { padding: 8px 14px; font-size: 0.78rem; min-height: 38px; }
            .sort-btn { padding: 8px 12px; font-size: 0.78rem; min-height: 36px; }
            .sort-bar { flex-wrap: wrap; gap: 6px; padding: 0 15px 16px; }
            .view-btn { padding: 8px 14px; font-size: 0.75rem; min-height: 38px; }
        }

        @media (max-width: 480px) {
            .vinho-grid { grid-template-columns: 1fr; gap: 12px; padding: 12px 4%; }
            .filter-chip { padding: 10px 16px; font-size: 0.8rem; min-height: 44px; }
            .filter-chip:active { background: linear-gradient(135deg, var(--vinho-vivo), var(--vinho-escuro)); color: #fff; }
            .sort-btn { padding: 10px 12px; font-size: 0.8rem; min-height: 44px; }
            .sort-btn:active { color: var(--dourado); }
            .view-btn { padding: 10px 14px; font-size: 0.76rem; min-height: 44px; }
            .filters-bar { gap: 6px; padding: 10px 12px; }
            .search-section h1 { font-size: 1.2rem; }
            .search-section p.sub-titulo { font-size: 0.85rem; }
            .vinho-img-container { aspect-ratio: 1 / 1; }
            .timeline-track { padding-left: 30px; margin-left: 6px; }
            .timeline-month-label { padding-left: 28px; }
            .timeline-item::before { left: -34px; }
            .timeline-img { width: 48px; height: 48px; }
            .timeline-nota { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="search-section">
        <h1 data-i18n="catalogo.title">Nossa Adega</h1>
        <p class="sub-titulo" data-i18n="catalogo.subtitle">Todos os rótulos que já dividimos, com a nota de cada um de nós.</p>
        <div class="search-container">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input type="text" id="search" data-i18n-placeholder="catalogo.search_placeholder" placeholder="Pesquisar vinho, uva ou país..." data-i18n-aria-label="catalogo.search_placeholder" aria-label="Pesquisar vinho">
        </div>
    </div>

    <div class="filters-bar" id="filters-bar">
        <button class="filter-chip active" data-filter="todos" data-i18n="catalogo.filter_all">Todos</button>
        <button class="filter-chip" data-filter="Tinto" data-i18n="catalogo.filter_red">Tintos</button>
        <button class="filter-chip" data-filter="Branco" data-i18n="catalogo.filter_white">Brancos</button>
        <button class="filter-chip" data-filter="Rosé" data-i18n="catalogo.filter_rose">Rosés</button>
        <button class="filter-chip" data-filter="Espumante" data-i18n="catalogo.filter_sparkling">Espumantes</button>
    </div>

    <div class="view-toggle">
        <button class="view-btn active" id="view-grade-btn">
            <i class="fas fa-th" aria-hidden="true"></i> <span data-i18n="catalogo.view_grid">Grade</span>
        </button>
        <button class="view-btn" id="view-timeline-btn">
            <i class="fas fa-stream" aria-hidden="true"></i> <span data-i18n="catalogo.view_timeline">Linha do Tempo</span>
        </button>
    </div>

    <div class="sort-bar" id="sort-bar">
        <span data-i18n="catalogo.sort_label">Ordenar:</span>
        <button class="sort-btn active" data-sort="recentes" data-i18n="catalogo.sort_recent">Mais Recentes</button>
        <button class="sort-btn" data-sort="nota-desc" data-i18n="catalogo.sort_rating_desc">Maior Nota</button>
        <button class="sort-btn" data-sort="nota-asc" data-i18n="catalogo.sort_rating_asc">Menor Nota</button>
        <button class="sort-btn" data-sort="az" data-i18n="catalogo.sort_az">A–Z</button>
    </div>

    <div class="result-count" id="result-count"></div>

    <!-- Skeleton loading -->
    <div class="vinho-grid" id="skeleton-grid">
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
    </div>

    <div class="vinho-grid" id="vinho-grid" style="display:none;"></div>
    <div class="timeline-container" id="timeline-container" style="display:none;"></div>

    <div id="footer-placeholder"></div>

    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvM8_kK9_BXLAhhEjdmsAIgofCEjWvw-BcPXx4G1GEXeKkJwILDCkckuvg29FsiHFf/exec";
        const IMG_PADRAO = "assets/wine-placeholder.svg";
const getFlagUrl = (pais) => {
    if (!pais) return 'https://flagcdn.com/w80/un.png';
    const n = pais.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
    const flags = {
        "franca": "fr", "italia": "it", "espanha": "es", "portugal": "pt", "chile": "cl",
        "argentina": "ar", "estados unidos": "us", "eua": "us", "brasil": "br", "alemanha": "de",
        "austria": "at", "australia": "au", "nova zelandia": "nz", "africa do sul": "za",
        "uruguai": "uy", "hungria": "hu", "grecia": "gr", "georgia": "ge", "suica": "ch",
        "israel": "il", "libano": "lb", "romenia": "ro", "bulgaria": "bg", "croacia": "hr",
        "eslovenia": "si", "moldavia": "md", "canada": "ca", "inglaterra": "gb", "reino unido": "gb",
        "japao": "jp", "china": "cn"
    };
    return `https://flagcdn.com/w80/${flags[n] || "un"}.png`;
};
        let vinhos = [];
        let filtroAtual = 'todos';
        let ordenacaoAtual = 'recentes';
        let buscaAtual = '';
        let viewMode = localStorage.getItem('adega_view_mode') || 'grade';

        function parseFloat2(val) {
            if (!val) return 0;
            return parseFloat(String(val).replace(',', '.')) || 0;
        }

        function resolveFoto(v) {
            let urlFinal = IMG_PADRAO;
            const fotoRaw = v['Foto'] || v['foto'];
            if (fotoRaw && fotoRaw.length > 10) {
                if (fotoRaw.startsWith('data:image')) {
                    urlFinal = fotoRaw;
                } else if (fotoRaw.includes('drive.google.com')) {
                    const id = fotoRaw.match(/[-\w]{25,}/);
                    urlFinal = id ? `https://lh3.googleusercontent.com/d/${id[0]}` : fotoRaw;
                } else {
                    urlFinal = fotoRaw;
                }
            }
            return urlFinal;
        }

        function toVinhoObj(v) {
            const notaF = parseFloat2(v['Pontuação Fellype']);
            const notaH = parseFloat2(v['Pontuação Hwlly']);
            const idx = vinhos.indexOf(v);
            return {
                nome: v['Nome do Vinho'],
                produtor: v['Produtor'] || v['Vinícola'] || '',
                pais: v['País'] || v['Pais'],
                regiao: v['Região'] || v['Regiao'],
                uva: v['Uva(s)'] || v['Uva'],
                tipo: v['Tipo'],
                safra: v['Safra'],
                teor: v['Teor Alcoólico'] || v['Teor'],
                classificacao: v['Classificação'] || v['Classificacao'],
                data: v['Ano de Consumo'] || v['Data'],
                notaF: notaF || null,
                notaH: notaH || null,
                foto: resolveFoto(v),
                numero: idx >= 0 ? vinhos.length - idx : null,
                artigo: v['Artigo'] || null,
                artigoPublicado: v['Artigo Publicado'] === 'SIM' || v['Artigo Publicado'] === true,
                linha: v['_linha'] || null,
            };
        }

        async function fetchVinhos() {
            try {
                vinhos = await fetchWithCache(SCRIPT_URL);

                // Verificar parâmetro de URL
                const params = new URLSearchParams(window.location.search);
                if (params.get('filtro') === 'ultimos') {
                    ordenacaoAtual = 'recentes';
                    document.querySelector('[data-sort="recentes"]').classList.add('active');
                }

                document.getElementById('skeleton-grid').style.display = 'none';
                document.getElementById('vinho-grid').style.display = 'grid';
                aplicarFiltros();

                const linhaParam = parseInt(params.get('linha'), 10);
                const vinhoParam = params.get('vinho');
                let alvo = null;
                if (linhaParam) {
                    alvo = vinhos.find(v => v['_linha'] === linhaParam);
                } else if (vinhoParam) {
                    // Compatibilidade com links antigos gerados por nome (menos preciso:
                    // se houver dois vinhos com o mesmo nome, pega o primeiro encontrado).
                    alvo = vinhos.find(v => (v['Nome do Vinho'] || '').trim().toLowerCase() === vinhoParam.trim().toLowerCase());
                }
                if (alvo) setTimeout(() => WineModal.open(toVinhoObj(alvo)), 250);
            } catch (e) {
                document.getElementById('skeleton-grid').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>${I18N.t('catalogo.error_title')}</h3>
                        <p>${I18N.t('catalogo.error_text')}</p>
                    </div>`;
            }
        }

        function aplicarFiltros() {
            let lista = [...vinhos];

            // Filtro por tipo
            if (filtroAtual !== 'todos') {
                lista = lista.filter(v => {
                    const tipo = (v['Tipo'] || v['tipo'] || '').toLowerCase();
                    return tipo.includes(filtroAtual.toLowerCase());
                });
            }

            // Busca textual
            if (buscaAtual) {
                lista = lista.filter(v =>
                    Object.values(v).some(val => val && val.toString().toLowerCase().includes(buscaAtual))
                );
            }

            // Ordenação
            if (ordenacaoAtual === 'nota-desc') {
                lista.sort((a, b) => {
                    const ma = (parseFloat2(a['Pontuação Fellype']) + parseFloat2(a['Pontuação Hwlly'])) / 2;
                    const mb = (parseFloat2(b['Pontuação Fellype']) + parseFloat2(b['Pontuação Hwlly'])) / 2;
                    return mb - ma;
                });
            } else if (ordenacaoAtual === 'nota-asc') {
                lista.sort((a, b) => {
                    const ma = (parseFloat2(a['Pontuação Fellype']) + parseFloat2(a['Pontuação Hwlly'])) / 2;
                    const mb = (parseFloat2(b['Pontuação Fellype']) + parseFloat2(b['Pontuação Hwlly'])) / 2;
                    return ma - mb;
                });
            } else if (ordenacaoAtual === 'az') {
                lista.sort((a, b) => (a['Nome do Vinho'] || '').localeCompare(b['Nome do Vinho'] || ''));
            }
            // 'recentes' = ordem padrão da API

            if (viewMode === 'timeline') {
                renderTimeline(lista);
            } else {
                renderVinhos(lista);
            }
        }

        function parseDataVinho(str) {
            if (!str) return null;
            const s = String(str).trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return { year: +m[1], month: +m[2] };
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return { year: +m[3], month: +m[2] };
            m = s.match(/^(\d{4})$/);
            if (m) return { year: +m[1], month: null };
            return null;
        }

        const MESES_PT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        function renderTimeline(lista) {
            const container = document.getElementById('timeline-container');
            const grid = document.getElementById('vinho-grid');
            const count = document.getElementById('result-count');
            grid.style.display = 'none';
            container.style.display = 'block';

            if (lista.length === 0) {
                count.textContent = '';
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wine-glass"></i>
                        <h3>${I18N.t('catalogo.empty_title')}</h3>
                        <p>${I18N.t('catalogo.empty_text')}</p>
                        <button class="btn-limpar" onclick="limparFiltros()">${I18N.t('catalogo.btn_clear')}</button>
                    </div>`;
                return;
            }

            count.textContent = lista.length + ' ' + (lista.length !== 1 ? I18N.t('catalogo.result_plural') : I18N.t('catalogo.result_singular'));

            const comData = [];
            const semData = [];
            lista.forEach(v => {
                const d = parseDataVinho(v['Ano de Consumo'] || v['Data']);
                if (d) comData.push({ v, d });
                else semData.push({ v, d: null });
            });
            comData.sort((a, b) => (b.d.year - a.d.year) || ((b.d.month || 0) - (a.d.month || 0)));

            const grupos = [];
            let grupoAtual = null;
            comData.forEach(({ v, d }) => {
                const chave = d.month ? `${d.year}-${d.month}` : `${d.year}`;
                if (!grupoAtual || grupoAtual.chave !== chave) {
                    grupoAtual = {
                        chave,
                        label: d.month ? `${MESES_PT[d.month - 1]} ${d.year}` : String(d.year),
                        itens: [],
                    };
                    grupos.push(grupoAtual);
                }
                grupoAtual.itens.push(v);
            });
            if (semData.length) {
                grupos.push({ chave: 'sem-data', label: I18N.t('catalogo.timeline_no_date'), itens: semData.map(s => s.v) });
            }

            container.innerHTML = grupos.map(g => `
                <div class="timeline-month">
                    <h2 class="timeline-month-label">${g.label}</h2>
                    <div class="timeline-track">
                        ${g.itens.map(v => {
                            const urlFinal = resolveFoto(v);
                            const notaF = parseFloat2(v['Pontuação Fellype']);
                            const notaH = parseFloat2(v['Pontuação Hwlly']);
                            const media = (notaF > 0 && notaH > 0) ? ((notaF + notaH) / 2).toFixed(1) : (notaF || notaH || null);
                            const vinhoObj = toVinhoObj(v);
                            return `
                            <div class="timeline-item" onclick='WineModal.open(${JSON.stringify(vinhoObj).replace(/'/g, "\\'")})' tabindex="0" role="button" aria-label="${I18N.t('common.view_details', { nome: v['Nome do Vinho'] || I18N.t('catalogo.special_label') })}">
                                <div class="timeline-card">
                                    <img class="timeline-img" src="${urlFinal}" loading="lazy" onerror="this.src='${IMG_PADRAO}'" alt="${v['Nome do Vinho'] || I18N.t('modal.wine_photo')}">
                                    <div class="timeline-info">
                                        <div class="timeline-date">${v['Ano de Consumo'] || v['Data'] || ''}</div>
                                        <div class="timeline-nome">${v['Nome do Vinho'] || I18N.t('catalogo.special_label')}</div>
                                        <div class="timeline-meta">${I18N.translateCountry(v['País']) || ''}${(v['Uva(s)'] || v['Uva']) ? ' · ' + (v['Uva(s)'] || v['Uva']) : ''}</div>
                                    </div>
                                    <div class="timeline-nota">${media ? '★ ' + media : ''}</div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`).join('');

            container.querySelectorAll('[role="button"]').forEach(item => {
                item.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') item.click();
                });
            });
        }

        function setViewMode(modo) {
            viewMode = modo;
            localStorage.setItem('adega_view_mode', modo);
            document.getElementById('view-grade-btn').classList.toggle('active', modo === 'grade');
            document.getElementById('view-timeline-btn').classList.toggle('active', modo === 'timeline');
            document.getElementById('sort-bar').style.display = modo === 'timeline' ? 'none' : 'flex';
            if (vinhos.length) aplicarFiltros();
        }

        function renderVinhos(lista) {
            const grid = document.getElementById('vinho-grid');
            const count = document.getElementById('result-count');
            document.getElementById('timeline-container').style.display = 'none';
            grid.style.display = 'grid';

            if (lista.length === 0) {
                count.textContent = '';
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wine-glass"></i>
                        <h3>${I18N.t('catalogo.empty_title')}</h3>
                        <p>${I18N.t('catalogo.empty_text')}</p>
                        <button class="btn-limpar" onclick="limparFiltros()">${I18N.t('catalogo.btn_clear')}</button>
                    </div>`;
                return;
            }

            count.textContent = lista.length + ' ' + (lista.length !== 1 ? I18N.t('catalogo.result_plural') : I18N.t('catalogo.result_singular'));

            grid.innerHTML = lista.map(v => {
                const urlFinal = resolveFoto(v);
                const notaF = parseFloat2(v['Pontuação Fellype']);
                const notaH = parseFloat2(v['Pontuação Hwlly']);
                const vinhoObj = toVinhoObj(v);

                return `
                <div class="vinho-card" onclick='WineModal.open(${JSON.stringify(vinhoObj).replace(/'/g, "\\'")})' tabindex="0" role="button" aria-label="${I18N.t('common.view_details', { nome: v['Nome do Vinho'] || I18N.t('catalogo.special_label') })}">
                    <div class="vinho-img-container">
                        <img class="vinho-img" src="${urlFinal}" loading="lazy" onerror="this.src='${IMG_PADRAO}'" alt="${v['Nome do Vinho'] || I18N.t('modal.wine_photo')}">
                    </div>
                    <div class="vinho-info">
                        <h3 class="vinho-nome">${v['Nome do Vinho'] || I18N.t('catalogo.special_label')}</h3>
                        <span class="vinho-data"><i class="far fa-calendar-alt" aria-hidden="true"></i> ${v['Ano de Consumo'] || 'N/A'}</span>
                        <div class="vinho-detalhes">
                            <span><i class="fas fa-seedling" aria-hidden="true"></i> ${v['Uva(s)'] || I18N.t('catalogo.grape_not_informed')}</span>
                            <span><i class="fas fa-globe-americas" aria-hidden="true"></i> <img src="${getFlagUrl(v['País'] || v['Pais'])}" class="vinho-flag-icon" alt="">${I18N.translateCountry(v['País']) || I18N.t('catalogo.origin_not_informed')}${(v['Região'] || v['Regiao']) ? ' · ' + (v['Região'] || v['Regiao']) : ''}</span>
                        </div>
                        <div class="notas">
                            <div class="nota-box">
                                <span>Fellype</span>
                                <div class="nota-valor">${notaF || '—'}</div>
                            </div>
                            <div class="nota-box">
                                <span>Hwlly</span>
                                <div class="nota-valor">${notaH || '—'}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Tecla Enter nos cards (acessibilidade)
            grid.querySelectorAll('[role="button"]').forEach(card => {
                card.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') card.click();
                });
            });
        }

        function limparFiltros() {
            buscaAtual = '';
            filtroAtual = 'todos';
            document.getElementById('search').value = '';
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'todos'));
            aplicarFiltros();
        }

        // Busca
        document.getElementById('search').addEventListener('input', (e) => {
            buscaAtual = e.target.value.toLowerCase();
            aplicarFiltros();
        });

        // Filtros por tipo
        document.getElementById('filters-bar').addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            filtroAtual = chip.dataset.filter;
            aplicarFiltros();
        });

        // Ordenação
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                ordenacaoAtual = btn.dataset.sort;
                aplicarFiltros();
            });
        });

        // Alternância Grade / Linha do Tempo
        document.getElementById('view-grade-btn').addEventListener('click', () => setViewMode('grade'));
        document.getElementById('view-timeline-btn').addEventListener('click', () => setViewMode('timeline'));
        if (viewMode === 'timeline') {
            document.getElementById('view-grade-btn').classList.remove('active');
            document.getElementById('view-timeline-btn').classList.add('active');
            document.getElementById('sort-bar').style.display = 'none';
        }

        fetchVinhos();
        window.addEventListener('i18n:change', () => { if (vinhos.length) aplicarFiltros(); });
    </script>
</body>
</html>
