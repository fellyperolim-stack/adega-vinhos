<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo de Vinhos - Fellype & Hwlly</title>
    <meta name="description" content="Explore nossa lista completa com mais de 130 vinhos degustados. Filtre por país, uva ou vinícola.">
    <meta property="og:title" content="Nossa Adega Digital - Catálogo Completo">
    <meta property="og:description" content="Explore nossa lista completa com mais de 95 vinhos degustados.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fellypehwlly-adega.space/catalogo.html">
    <link rel="canonical" href="https://fellypehwlly-adega.space/catalogo.html">
    <meta property="og:image" content="https://fellypehwlly-adega.space/assets/og-image.png">
    <meta property="og:locale" content="pt_BR">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#15100f">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-180.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="shared.css">

    <style>
        .pagina { --gutter: clamp(16px, 5.5vw, 80px); max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }

        /* --- CABEÇALHO --- */
        .search-section {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px 24px;
            padding: clamp(36px, 5vw, 56px) 0 28px;
            outline: none;
        }
        .search-section h1 { margin: 0; font-size: clamp(2.6rem, 5vw, 3.8rem); line-height: 1; color: var(--titulo); }
        .search-section p.sub-titulo { margin: 10px 0 0; color: var(--subtexto); font-size: 1.05rem; }

        .result-count { font-size: 0.98rem; color: var(--subtexto); white-space: nowrap; }
        .result-count b { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; color: var(--dourado-claro); margin-right: 4px; }

        /* --- BARRA ÚNICA DE CONTROLES --- */
        .toolbar {
            position: sticky;
            top: calc(var(--nav-h) + 8px);
            z-index: 50;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 16px;
            background: rgba(29, 23, 22, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #2E2523;
        }

        .search-container { position: relative; flex: 1 1 260px; min-width: 0; }
        .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--texto-fraco); pointer-events: none; }

        #search {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border-radius: 10px;
            border: 1px solid #3A302D;
            background: var(--bg);
            color: var(--texto);
            outline: none;
            transition: var(--transicao);
            font-size: 1rem;
            font-family: var(--font-corpo);
        }
        #search::placeholder { color: var(--texto-fraco); }
        #search:focus { border-color: var(--dourado); }

        .filters-bar {
            display: flex;
            gap: 4px;
            padding: 4px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid #3A302D;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filters-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 14px;
            border-radius: 8px;
            border: none;
            background: none;
            color: var(--texto-suave);
            font-family: var(--font-corpo);
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transicao);
        }
        .filter-chip:hover { color: var(--titulo); background: var(--superficie-hover); }
        .filter-chip.active { background: var(--vinho-escuro); color: var(--titulo); font-weight: 500; }
        .filter-chip .tipo-ponto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        .sort-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            padding: 0 6px 0 14px;
            border-radius: 10px;
            border: 1px solid #3A302D;
            font-size: 0.95rem;
            color: var(--subtexto);
        }
        .sort-bar select {
            height: 44px;
            border: none;
            background: transparent;
            color: var(--texto);
            font-family: var(--font-corpo);
            font-size: 0.95rem;
            cursor: pointer;
            padding-right: 4px;
        }
        .sort-bar select option { background: var(--card); color: var(--texto); }

        .view-toggle { display: flex; gap: 4px; padding: 4px; border-radius: 12px; border: 1px solid #3A302D; }
        .view-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: none;
            color: var(--subtexto);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transicao);
        }
        .view-btn:hover { color: var(--titulo); }
        .view-btn.active { background: var(--card-alt); color: var(--dourado-claro); }

        /* --- GRID E CARDS --- */
        .vinho-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
            padding: 32px 0 72px;
        }

        .vinho-card {
            display: flex;
            flex-direction: column;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2E2523;
            transition: var(--transicao);
            cursor: pointer;
        }
        .vinho-card:hover { border-color: var(--borda-dourada); transform: translateY(-3px); }

        .vinho-img-container { position: relative; width: 100%; aspect-ratio: 4 / 5; background: var(--card-alt); overflow: hidden; }
        .vinho-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
        .vinho-card:hover .vinho-img { transform: scale(1.04); }

        .card-tag {
            position: absolute;
            top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(21, 16, 15, 0.88);
            font-size: 0.8rem;
            color: var(--texto-suave);
        }
        .card-tag.tipo { left: 12px; }
        .card-tag.media { right: 12px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.1; color: var(--dourado-claro); }
        .card-tag .tipo-ponto { width: 8px; height: 8px; border-radius: 50%; }

        .vinho-info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }

        .vinho-nome { margin: 0; font-size: 1.4rem; line-height: 1.15; color: var(--titulo); }
        .vinho-detalhes { font-size: 0.92rem; color: var(--subtexto); line-height: 1.5; }
        .vinho-flag-icon { width: 16px; height: 11px; object-fit: cover; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
        .vinho-data { font-size: 0.85rem; color: var(--texto-fraco); }

        .notas {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #2E2523;
            font-size: 0.88rem;
            color: var(--subtexto);
        }
        .notas b { color: var(--dourado-claro); font-weight: 600; margin-left: 4px; }
        .vinho-info .notas { margin-top: 8px; }

        /* --- EMPTY STATE --- */
        .empty-state { text-align: center; padding: 72px 20px; color: var(--subtexto); grid-column: 1 / -1; }
        .empty-state i { font-size: 2rem; color: #4A3E39; margin-bottom: 16px; display: block; }
        .empty-state h3 { color: var(--texto-suave); font-size: 1.6rem; margin: 0 0 6px; }
        .empty-state p { margin: 0; font-size: 0.98rem; color: var(--subtexto); }
        .btn-limpar { margin-top: 20px; }

        /* --- SKELETON --- */
        .skeleton-card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid #2E2523; }
        .sk-img { aspect-ratio: 4 / 5; }
        .sk-body { padding: 18px; }
        .sk-line { height: 13px; border-radius: 4px; margin-bottom: 10px; }
        .sk-line.short { width: 40%; }
        .sk-line.med { width: 70%; }

        /* --- LINHA DO TEMPO --- */
        .timeline-container { max-width: 760px; margin: 0 auto; padding: 36px 0 72px; }
        .timeline-month { margin-bottom: 36px; }
        .timeline-month-label {
            font-size: 1.7rem;
            color: var(--titulo);
            margin: 0 0 16px;
            padding-left: 40px;
            position: relative;
        }
        .timeline-month-label::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--dourado);
        }
        .timeline-track { position: relative; padding-left: 40px; margin-left: 11px; border-left: 1px solid #3A302D; }
        .timeline-item { position: relative; margin-bottom: 12px; cursor: pointer; }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -45px;
            top: 50%;
            width: 9px; height: 9px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: #5A4A3E;
        }
        .timeline-card {
            display: flex;
            gap: 14px;
            align-items: center;
            background: var(--card);
            border: 1px solid #2E2523;
            border-radius: 14px;
            padding: 12px;
            transition: var(--transicao);
        }
        .timeline-card:hover { border-color: var(--borda-dourada); }
        .timeline-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--card-alt); }
        .timeline-info { flex: 1; min-width: 0; }
        .timeline-date { font-size: 0.85rem; color: var(--texto-fraco); }
        .timeline-nome { font-family: var(--font-display); color: var(--titulo); font-size: 1.3rem; font-weight: 600; line-height: 1.2; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .timeline-meta { font-size: 0.9rem; color: var(--subtexto); }
        .timeline-nota { font-family: var(--font-display); color: var(--dourado-claro); font-weight: 600; font-size: 1.4rem; flex-shrink: 0; }

        @media (max-width: 860px) {
            .toolbar { position: static; }
            .filters-bar { order: 3; flex: 1 1 100%; }
            .search-container { flex-basis: 100%; }
            .sort-bar { flex: 1 1 auto; }
            .sort-bar select { flex: 1; }
        }

        @media (max-width: 560px) {
            .vinho-grid { grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 20px; }
            .vinho-img-container { aspect-ratio: 1 / 1; }
            .vinho-info { padding: 12px; }
            .vinho-nome { font-size: 1.15rem; }
            .vinho-detalhes { font-size: 0.85rem; }
            .vinho-data { display: none; }
            .notas { flex-direction: column; gap: 2px; font-size: 0.82rem; }
            .card-tag.tipo { display: none; }
            .timeline-track { padding-left: 26px; margin-left: 6px; }
            .timeline-month-label { padding-left: 26px; font-size: 1.45rem; }
            .timeline-item::before { left: -31px; }
            .timeline-img { width: 50px; height: 50px; }
        }

        @media (max-width: 360px) {
            .vinho-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="pagina">
    <div class="search-section">
        <div>
            <h1 data-i18n="catalogo.title">Nossa Adega</h1>
            <p class="sub-titulo" data-i18n="catalogo.subtitle">Todos os rótulos que já dividimos, com a nota de cada um de nós.</p>
        </div>
        <div class="result-count" id="result-count" aria-live="polite"></div>
    </div>

    <div class="toolbar" role="search">
        <div class="search-container">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input type="search" id="search" data-i18n-placeholder="catalogo.search_placeholder" placeholder="Pesquisar vinho, uva ou país..." data-i18n-aria-label="catalogo.search_placeholder" aria-label="Pesquisar vinho" autocomplete="off">
        </div>

        <div class="filters-bar" id="filters-bar">
            <button type="button" class="filter-chip active" data-filter="todos" aria-pressed="true"><span data-i18n="catalogo.filter_all">Todos</span></button>
            <button type="button" class="filter-chip" data-filter="Tinto" aria-pressed="false"><span class="tipo-ponto" style="background:var(--tipo-tinto)"></span><span data-i18n="catalogo.filter_red">Tintos</span></button>
            <button type="button" class="filter-chip" data-filter="Branco" aria-pressed="false"><span class="tipo-ponto" style="background:var(--tipo-branco)"></span><span data-i18n="catalogo.filter_white">Brancos</span></button>
            <button type="button" class="filter-chip" data-filter="Rosé" aria-pressed="false"><span class="tipo-ponto" style="background:var(--tipo-rose)"></span><span data-i18n="catalogo.filter_rose">Rosés</span></button>
            <button type="button" class="filter-chip" data-filter="Espumante" aria-pressed="false"><span class="tipo-ponto" style="background:var(--tipo-espumante)"></span><span data-i18n="catalogo.filter_sparkling">Espumantes</span></button>
        </div>

        <label class="sort-bar" id="sort-bar">
            <span data-i18n="catalogo.sort_label">Ordenar:</span>
            <select id="sort-select">
                <option value="recentes" data-i18n="catalogo.sort_recent">Mais Recentes</option>
                <option value="nota-desc" data-i18n="catalogo.sort_rating_desc">Maior Nota</option>
                <option value="nota-asc" data-i18n="catalogo.sort_rating_asc">Menor Nota</option>
                <option value="az" data-i18n="catalogo.sort_az">A–Z</option>
            </select>
        </label>

        <div class="view-toggle">
            <button type="button" class="view-btn active" id="view-grade-btn" aria-pressed="true" data-i18n-aria-label="catalogo.view_grid" aria-label="Grade" data-i18n-title="catalogo.view_grid" title="Grade">
                <i class="fas fa-th-large" aria-hidden="true"></i>
            </button>
            <button type="button" class="view-btn" id="view-timeline-btn" aria-pressed="false" data-i18n-aria-label="catalogo.view_timeline" aria-label="Linha do Tempo" data-i18n-title="catalogo.view_timeline" title="Linha do Tempo">
                <i class="fas fa-stream" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Skeleton loading -->
    <div class="vinho-grid" id="skeleton-grid">
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
        <div class="skeleton-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton med"></div><div class="sk-line skeleton short"></div><div class="sk-line skeleton med"></div></div></div>
    </div>

    <div class="vinho-grid" id="vinho-grid" style="display:none;"></div>
    <div class="timeline-container" id="timeline-container" style="display:none;"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvM8_kK9_BXLAhhEjdmsAIgofCEjWvw-BcPXx4G1GEXeKkJwILDCkckuvg29FsiHFf/exec";
        const IMG_PADRAO = "assets/wine-placeholder.svg";
const getFlagUrl = (pais) => {
    if (!pais) return 'https://flagcdn.com/w80/un.png';
    const n = pais.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
    const flags = {
        "franca": "fr", "italia": "it", "espanha": "es", "portugal": "pt", "chile": "cl",
        "argentina": "ar", "estados unidos": "us", "eua": "us", "brasil": "br", "alemanha": "de",
        "austria": "at", "australia": "au", "nova zelandia": "nz", "africa do sul": "za",
        "uruguai": "uy", "hungria": "hu", "grecia": "gr", "georgia": "ge", "suica": "ch",
        "israel": "il", "libano": "lb", "romenia": "ro", "bulgaria": "bg", "croacia": "hr",
        "eslovenia": "si", "moldavia": "md", "canada": "ca", "inglaterra": "gb", "reino unido": "gb",
        "japao": "jp", "china": "cn"
    };
    return `https://flagcdn.com/w80/${flags[n] || "un"}.png`;
};
        const esc = (s) => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const fmtNota = (n) => {
            const lang = I18N.getLang();
            return Number(n).toLocaleString(lang === 'pt' ? 'pt-BR' : lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        };
        const TIPO_COR = [['tinto', 'var(--tipo-tinto)'], ['branco', 'var(--tipo-branco)'], ['ros', 'var(--tipo-rose)'], ['espumante', 'var(--tipo-espumante)']];
        const corTipo = (t) => (TIPO_COR.find(([k]) => (t || '').toLowerCase().includes(k)) || [0, 'var(--dourado)'])[1];

        let vinhos = [];
        let filtroAtual = 'todos';
        let ordenacaoAtual = 'recentes';
        let buscaAtual = '';
        let viewMode = localStorage.getItem('adega_view_mode') || 'grade';

        function parseFloat2(val) {
            if (!val) return 0;
            return parseFloat(String(val).replace(',', '.')) || 0;
        }

        function resolveFoto(v) {
            let urlFinal = IMG_PADRAO;
            const fotoRaw = v['Foto'] || v['foto'];
            if (fotoRaw && fotoRaw.length > 10) {
                if (fotoRaw.startsWith('data:image')) {
                    urlFinal = fotoRaw;
                } else if (fotoRaw.includes('drive.google.com')) {
                    const id = fotoRaw.match(/[-\w]{25,}/);
                    urlFinal = id ? `https://lh3.googleusercontent.com/d/${id[0]}` : fotoRaw;
                } else {
                    urlFinal = fotoRaw;
                }
            }
            return urlFinal;
        }

        function toVinhoObj(v) {
            const notaF = parseFloat2(v['Pontuação Fellype']);
            const notaH = parseFloat2(v['Pontuação Hwlly']);
            const idx = vinhos.indexOf(v);
            return {
                nome: v['Nome do Vinho'],
                produtor: v['Produtor'] || v['Vinícola'] || '',
                pais: v['País'] || v['Pais'],
                regiao: v['Região'] || v['Regiao'],
                uva: v['Uva(s)'] || v['Uva'],
                tipo: v['Tipo'],
                safra: v['Safra'],
                teor: v['Teor Alcoólico'] || v['Teor'],
                classificacao: v['Classificação'] || v['Classificacao'],
                data: v['Ano de Consumo'] || v['Data'],
                notaF: notaF || null,
                notaH: notaH || null,
                foto: resolveFoto(v),
                numero: idx >= 0 ? vinhos.length - idx : null,
                artigo: v['Artigo'] || null,
                artigoPublicado: v['Artigo Publicado'] === 'SIM' || v['Artigo Publicado'] === true,
                linha: v['_linha'] || null,
            };
        }

        async function fetchVinhos() {
            try {
                vinhos = await fetchWithCache(SCRIPT_URL);

                // Verificar parâmetro de URL
                const params = new URLSearchParams(window.location.search);
                if (params.get('filtro') === 'ultimos') {
                    ordenacaoAtual = 'recentes';
                    document.getElementById('sort-select').value = 'recentes';
                }

                document.getElementById('skeleton-grid').style.display = 'none';
                document.getElementById('vinho-grid').style.display = 'grid';
                aplicarFiltros();

                const linhaParam = parseInt(params.get('linha'), 10);
                const vinhoParam = params.get('vinho');
                let alvo = null;
                if (linhaParam) {
                    alvo = vinhos.find(v => v['_linha'] === linhaParam);
                } else if (vinhoParam) {
                    // Compatibilidade com links antigos gerados por nome (menos preciso:
                    // se houver dois vinhos com o mesmo nome, pega o primeiro encontrado).
                    alvo = vinhos.find(v => (v['Nome do Vinho'] || '').trim().toLowerCase() === vinhoParam.trim().toLowerCase());
                }
                if (alvo) setTimeout(() => WineModal.open(toVinhoObj(alvo)), 250);
            } catch (e) {
                document.getElementById('skeleton-grid').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
                        <h3>${I18N.t('catalogo.error_title')}</h3>
                        <p>${I18N.t('catalogo.error_text')}</p>
                        <button type="button" class="btn-secundario btn-limpar" onclick="location.reload()">${I18N.t('index.btn_retry')}</button>
                    </div>`;
            }
        }

        function aplicarFiltros() {
            let lista = [...vinhos];

            // Filtro por tipo
            if (filtroAtual !== 'todos') {
                lista = lista.filter(v => {
                    const tipo = (v['Tipo'] || v['tipo'] || '').toLowerCase();
                    return tipo.includes(filtroAtual.toLowerCase());
                });
            }

            // Busca textual
            if (buscaAtual) {
                lista = lista.filter(v =>
                    Object.values(v).some(val => val && val.toString().toLowerCase().includes(buscaAtual))
                );
            }

            // Ordenação
            if (ordenacaoAtual === 'nota-desc') {
                lista.sort((a, b) => {
                    const ma = (parseFloat2(a['Pontuação Fellype']) + parseFloat2(a['Pontuação Hwlly'])) / 2;
                    const mb = (parseFloat2(b['Pontuação Fellype']) + parseFloat2(b['Pontuação Hwlly'])) / 2;
                    return mb - ma;
                });
            } else if (ordenacaoAtual === 'nota-asc') {
                lista.sort((a, b) => {
                    const ma = (parseFloat2(a['Pontuação Fellype']) + parseFloat2(a['Pontuação Hwlly'])) / 2;
                    const mb = (parseFloat2(b['Pontuação Fellype']) + parseFloat2(b['Pontuação Hwlly'])) / 2;
                    return ma - mb;
                });
            } else if (ordenacaoAtual === 'az') {
                lista.sort((a, b) => (a['Nome do Vinho'] || '').localeCompare(b['Nome do Vinho'] || ''));
            }
            // 'recentes' = ordem padrão da API

            if (viewMode === 'timeline') {
                renderTimeline(lista);
            } else {
                renderVinhos(lista);
            }
        }

        function parseDataVinho(str) {
            if (!str) return null;
            const s = String(str).trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return { year: +m[1], month: +m[2] };
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return { year: +m[3], month: +m[2] };
            m = s.match(/^(\d{4})$/);
            if (m) return { year: +m[1], month: null };
            return null;
        }

        const MESES_PT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        function renderTimeline(lista) {
            const container = document.getElementById('timeline-container');
            const grid = document.getElementById('vinho-grid');
            const count = document.getElementById('result-count');
            grid.style.display = 'none';
            container.style.display = 'block';

            if (lista.length === 0) {
                count.textContent = '';
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wine-glass" aria-hidden="true"></i>
                        <h3>${I18N.t('catalogo.empty_title')}</h3>
                        <p>${I18N.t('catalogo.empty_text')}</p>
                        <button type="button" class="btn-secundario btn-limpar" onclick="limparFiltros()">${I18N.t('catalogo.btn_clear')}</button>
                    </div>`;
                return;
            }

            count.innerHTML = `<b>${lista.length}</b>${lista.length !== 1 ? I18N.t('catalogo.result_plural') : I18N.t('catalogo.result_singular')}`;

            const comData = [];
            const semData = [];
            lista.forEach(v => {
                const d = parseDataVinho(v['Ano de Consumo'] || v['Data']);
                if (d) comData.push({ v, d });
                else semData.push({ v, d: null });
            });
            comData.sort((a, b) => (b.d.year - a.d.year) || ((b.d.month || 0) - (a.d.month || 0)));

            const grupos = [];
            let grupoAtual = null;
            comData.forEach(({ v, d }) => {
                const chave = d.month ? `${d.year}-${d.month}` : `${d.year}`;
                if (!grupoAtual || grupoAtual.chave !== chave) {
                    grupoAtual = {
                        chave,
                        label: d.month ? `${MESES_PT[d.month - 1]} ${d.year}` : String(d.year),
                        itens: [],
                    };
                    grupos.push(grupoAtual);
                }
                grupoAtual.itens.push(v);
            });
            if (semData.length) {
                grupos.push({ chave: 'sem-data', label: I18N.t('catalogo.timeline_no_date'), itens: semData.map(s => s.v) });
            }

            container.innerHTML = grupos.map(g => `
                <div class="timeline-month">
                    <h2 class="timeline-month-label">${g.label}</h2>
                    <div class="timeline-track">
                        ${g.itens.map(v => {
                            const urlFinal = resolveFoto(v);
                            const notaF = parseFloat2(v['Pontuação Fellype']);
                            const notaH = parseFloat2(v['Pontuação Hwlly']);
                            const media = (notaF > 0 && notaH > 0) ? ((notaF + notaH) / 2).toFixed(1) : (notaF || notaH || null);
                            const vinhoObj = toVinhoObj(v);
                            return `
                            <div class="timeline-item" onclick='WineModal.open(${JSON.stringify(vinhoObj).replace(/&/g, '&amp;').replace(/'/g, '&#39;')})' tabindex="0" role="button" aria-label="${I18N.t('common.view_details', { nome: v['Nome do Vinho'] || I18N.t('catalogo.special_label') })}">
                                <div class="timeline-card">
                                    <img class="timeline-img" src="${urlFinal}" loading="lazy" onerror="this.src='${IMG_PADRAO}'" alt="${v['Nome do Vinho'] || I18N.t('modal.wine_photo')}">
                                    <div class="timeline-info">
                                        <div class="timeline-date">${v['Ano de Consumo'] || v['Data'] || ''}</div>
                                        <div class="timeline-nome">${v['Nome do Vinho'] || I18N.t('catalogo.special_label')}</div>
                                        <div class="timeline-meta">${I18N.translateCountry(v['País']) || ''}${(v['Uva(s)'] || v['Uva']) ? ' · ' + (v['Uva(s)'] || v['Uva']) : ''}</div>
                                    </div>
                                    <div class="timeline-nota">${media ? fmtNota(media) : ''}</div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`).join('');

            container.querySelectorAll('[role="button"]').forEach(item => {
                item.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') item.click();
                });
            });
        }

        function setViewMode(modo) {
            viewMode = modo;
            try { localStorage.setItem('adega_view_mode', modo); } catch (e) {}
            const bg = document.getElementById('view-grade-btn'), bt = document.getElementById('view-timeline-btn');
            bg.classList.toggle('active', modo === 'grade'); bg.setAttribute('aria-pressed', modo === 'grade');
            bt.classList.toggle('active', modo === 'timeline'); bt.setAttribute('aria-pressed', modo === 'timeline');
            document.getElementById('sort-bar').style.display = modo === 'timeline' ? 'none' : 'flex';
            if (vinhos.length) aplicarFiltros();
        }

        function renderVinhos(lista) {
            const grid = document.getElementById('vinho-grid');
            const count = document.getElementById('result-count');
            document.getElementById('timeline-container').style.display = 'none';
            grid.style.display = 'grid';

            if (lista.length === 0) {
                count.textContent = '';
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wine-glass" aria-hidden="true"></i>
                        <h3>${I18N.t('catalogo.empty_title')}</h3>
                        <p>${I18N.t('catalogo.empty_text')}</p>
                        <button type="button" class="btn-secundario btn-limpar" onclick="limparFiltros()">${I18N.t('catalogo.btn_clear')}</button>
                    </div>`;
                return;
            }

            count.innerHTML = `<b>${lista.length}</b>${lista.length !== 1 ? I18N.t('catalogo.result_plural') : I18N.t('catalogo.result_singular')}`;

            grid.innerHTML = lista.map(v => {
                const urlFinal = resolveFoto(v);
                const notaF = parseFloat2(v['Pontuação Fellype']);
                const notaH = parseFloat2(v['Pontuação Hwlly']);
                const vinhoObj = toVinhoObj(v);

                const media = (notaF > 0 && notaH > 0) ? (notaF + notaH) / 2 : (notaF || notaH || 0);
                const nome = esc(v['Nome do Vinho'] || I18N.t('catalogo.special_label'));
                const tipo = v['Tipo'] || v['tipo'] || '';
                const pais = v['País'] || v['Pais'];
                const uva = v['Uva(s)'] || v['Uva'];
                const regiao = v['Região'] || v['Regiao'];
                const data = v['Ano de Consumo'] || v['Data'];

                return `
                <div class="vinho-card" onclick='WineModal.open(${JSON.stringify(vinhoObj).replace(/&/g, '&amp;').replace(/'/g, '&#39;')})' tabindex="0" role="button" aria-label="${esc(I18N.t('common.view_details', { nome: v['Nome do Vinho'] || I18N.t('catalogo.special_label') }))}">
                    <div class="vinho-img-container">
                        <img class="vinho-img" src="${urlFinal}" loading="lazy" onerror="this.src='${IMG_PADRAO}'" alt="" width="400" height="500">
                        ${tipo ? `<span class="card-tag tipo"><span class="tipo-ponto" style="background:${corTipo(tipo)}"></span>${esc(I18N.translateTipo(tipo))}</span>` : ''}
                        ${media ? `<span class="card-tag media">${fmtNota(media)}</span>` : ''}
                    </div>
                    <div class="vinho-info">
                        <h3 class="vinho-nome">${nome}</h3>
                        <div class="vinho-detalhes">${pais ? `<img src="${getFlagUrl(pais)}" class="vinho-flag-icon" alt="">${esc(I18N.translateCountry(pais))}${regiao ? ' · ' + esc(regiao) : ''}` : esc(I18N.t('catalogo.origin_not_informed'))}<br>${esc(uva || I18N.t('catalogo.grape_not_informed'))}${v['Safra'] ? ' · ' + esc(v['Safra']) : ''}</div>
                        ${data ? `<div class="vinho-data">${esc(I18N.t('modal.tasted_on'))} ${esc(data)}</div>` : ''}
                        <div class="notas">
                            <span>Fellype<b>${notaF ? fmtNota(notaF) : '—'}</b></span>
                            <span>Hwlly<b>${notaH ? fmtNota(notaH) : '—'}</b></span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Tecla Enter nos cards (acessibilidade)
            grid.querySelectorAll('[role="button"]').forEach(card => {
                card.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') card.click();
                });
            });
        }

        function limparFiltros() {
            buscaAtual = '';
            filtroAtual = 'todos';
            document.getElementById('search').value = '';
            document.querySelectorAll('.filter-chip').forEach(c => { const on = c.dataset.filter === 'todos'; c.classList.toggle('active', on); c.setAttribute('aria-pressed', on); });
            aplicarFiltros();
        }

        // Busca
        document.getElementById('search').addEventListener('input', (e) => {
            buscaAtual = e.target.value.toLowerCase();
            aplicarFiltros();
        });

        // Filtros por tipo
        document.getElementById('filters-bar').addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            document.querySelectorAll('.filter-chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
            chip.classList.add('active');
            chip.setAttribute('aria-pressed', 'true');
            filtroAtual = chip.dataset.filter;
            aplicarFiltros();
        });

        // Ordenação
        document.getElementById('sort-select').addEventListener('change', (e) => {
            ordenacaoAtual = e.target.value;
            aplicarFiltros();
        });

        // Alternância Grade / Linha do Tempo
        document.getElementById('view-grade-btn').addEventListener('click', () => setViewMode('grade'));
        document.getElementById('view-timeline-btn').addEventListener('click', () => setViewMode('timeline'));
        if (viewMode === 'timeline') setViewMode('timeline');

        fetchVinhos();
        window.addEventListener('i18n:change', () => { if (vinhos.length) aplicarFiltros(); });
    </script>
</body>
</html>
