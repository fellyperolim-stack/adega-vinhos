<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinícolas - Fellype & Hwlly</title>
    <meta name="description" content="Explore todos os produtores e vinícolas da nossa adega. Descubra quais rótulos provamos de cada vinícola.">
    <meta property="og:title" content="Vinícolas da Adega | Fellype & Hwlly">
    <meta property="og:description" content="Explore todos os produtores e vinícolas da nossa adega digital.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fellypehwlly-adega.space/vinicolas.html">
    <link rel="canonical" href="https://fellypehwlly-adega.space/vinicolas.html">
    <meta property="og:image" content="https://fellypehwlly-adega.space/assets/og-image.png">
    <meta property="og:locale" content="pt_BR">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#15100f">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-180.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Outfit:wght@300;400;500;600&amp;display=swap">
    <link rel="stylesheet" href="shared.css">

    <style>
        /* --- CONTEÚDO --- */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 5% 70px; }

        /* --- BUSCA --- */
        .search-container {
            position: relative;
            max-width: 480px;
            margin: 0 auto 28px;
        }
        .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--texto-fraco); pointer-events: none; }

        #search-vinicola {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border-radius: 10px;
            border: 1px solid #3A302D;
            background: var(--card);
            color: var(--texto);
            outline: none;
            transition: var(--transicao);
            font-size: 1rem;
            font-family: var(--font-corpo);
        }
        #search-vinicola::placeholder { color: var(--texto-fraco); }
        #search-vinicola:focus { border-color: var(--dourado); }

        /* --- ACORDEÃO --- */
        .vinicola-group {
            margin-bottom: 12px;
            border: 1px solid #2E2523;
            border-radius: 14px;
            overflow: hidden;
            transition: var(--transicao);
        }
        .vinicola-group:hover { border-color: rgba(198, 161, 91, 0.25); }

        .vinicola-header {
            background: var(--card);
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .vinicola-header h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.55rem;
            line-height: 1.15;
            color: var(--titulo);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .vinicola-header h2 i { color: var(--dourado); font-size: 0.95rem; opacity: 0.8; }

        .vinicola-meta { display: flex; align-items: center; gap: 12px; }
        .vinicola-media { font-size: 1.15rem; font-weight: 600; color: var(--dourado-claro); font-family: var(--font-display); }
        .vinicola-count { font-size: 0.9rem; color: var(--subtexto); min-width: 20px; text-align: right; }
        .chevron { transition: var(--transicao); color: var(--dourado); font-size: 0.95rem; opacity: 0.7; }
        .vinicola-group.active .chevron { transform: rotate(180deg); opacity: 1; }

        .vinicola-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: #181211;
        }

        .vinicola-group.active .vinicola-content {
            max-height: 3000px;
            padding: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- GRID DE VINHOS --- */
        .wine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

        .wine-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transicao);
            cursor: pointer;
        }

        .wine-card:hover { border-color: var(--borda-dourada); background: rgba(255, 255, 255, 0.04); }

        .wine-img { width: 56px; height: 56px; border-radius: 7px; object-fit: cover; flex-shrink: 0; background: var(--card-alt); }

        .wine-info h3 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--titulo);
            line-height: 1.2;
        }

        .wine-info p {
            margin: 4px 0 0;
            font-size: 0.88rem;
            color: var(--subtexto);
        }
        .wine-info p i { color: var(--dourado); opacity: 0.8; margin-right: 2px; }

        .rating-badge {
            margin-left: auto;
            background: var(--card-alt);
            color: var(--dourado-claro);
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.2rem;
            line-height: 1.2;
            min-width: 52px;
            text-align: center;
            flex-shrink: 0;
            font-family: var(--font-display);
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--subtexto);
            font-family: 'Outfit', sans-serif;
        }
        .empty-state i { font-size: 2rem; color: #4A3E39; margin-bottom: 16px; display: block; }
        .empty-state p { margin: 0; font-size: 1rem; color: var(--subtexto); }

        /* --- SKELETONS --- */
        .skeleton-group { margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.04); border-radius: 14px; overflow: hidden; }
        .skeleton-header { padding: 18px 20px; background: #1d1716; display: flex; justify-content: space-between; align-items: center; }
        .skeleton-title { height: 16px; width: 200px; border-radius: 4px; }
        .skeleton-badge { height: 16px; width: 30px; border-radius: 4px; }

        #loader { padding: 20px 5% 60px; max-width: 1100px; margin: 0 auto; }

        @media (max-width: 992px) {
            .wine-grid { grid-template-columns: 1fr; }
            .vinicola-header { padding: 15px 16px; }
        }

        @media (max-width: 768px) {
            .content-area { padding: 16px 4%; }
            .vinicola-group { margin-bottom: 12px; }
            .vinicola-header { min-height: 52px; }
            .wine-item { padding: 12px 14px; gap: 10px; min-height: 60px; }
            .wine-item-img { width: 48px; height: 48px; }
            .search-vinicola-wrapper input { font-size: 16px; } /* previne zoom iOS */
        }

        @media (max-width: 480px) {
            .wine-grid { gap: 8px; }
            .wine-item-name { font-size: 0.85rem; }
            .wine-item-sub { font-size: 0.72rem; }
            .vinicola-header { padding: 14px 14px; }
        }

        @media (hover: none) {
            .vinicola-header:active { background: rgba(198, 161, 91,0.08); }
            .wine-item:active { background: rgba(255,255,255,0.04); }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <header class="header-section">
        <div class="shiba-heads">
            <div class="shiba-spotlight">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-TifEdyk31bue7ksGITNEiUrtAvl4H7_1V_UFojtvIA&s=10" class="avatar-lg" alt="Leblonzito">
            </div>
            <div class="shiba-spotlight">
                <img src="https://ih1.redbubble.net/image.4410098886.0898/bg,f8f8f8-flat,750x,075,f-pad,750x1000,f8f8f8.jpg" class="avatar-lg" alt="Ipanemita">
            </div>
        </div>
        <h1 data-i18n="vinicolas.title">Vinícolas & Produtores</h1>
        <p class="subtitulo" data-i18n="vinicolas.subtitle">Cada garrafa tem uma assinatura por trás.</p>
    </header>

    <div class="container" style="padding-top: 10px;">
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="search-vinicola" data-i18n-placeholder="vinicolas.search_placeholder" placeholder="Buscar vinícola ou produtor...">
        </div>
    </div>

    <div id="loader">
        <div class="skeleton-group">
            <div class="skeleton-header">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-badge"></div>
            </div>
        </div>
        <div class="skeleton-group">
            <div class="skeleton-header">
                <div class="skeleton skeleton-title" style="width:160px"></div>
                <div class="skeleton skeleton-badge"></div>
            </div>
        </div>
        <div class="skeleton-group">
            <div class="skeleton-header">
                <div class="skeleton skeleton-title" style="width:240px"></div>
                <div class="skeleton skeleton-badge"></div>
            </div>
        </div>
    </div>

    <main class="container" id="main-content" style="display:none; padding-top:0;"></main>

    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js" defer></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvM8_kK9_BXLAhhEjdmsAIgofCEjWvw-BcPXx4G1GEXeKkJwILDCkckuvg29FsiHFf/exec?action=getVinhos";
        const PLACEHOLDER_IMG = "assets/wine-placeholder.svg";

        let allGroups = {};
        let sortedVinicolas = [];

        function findVal(v, matches) {
            const keys = Object.keys(v);
            const k = keys.find(key => matches.some(m => key.toLowerCase().includes(m)));
            return k ? v[k] : null;
        }

        async function loadVinicolas() {
            try {
                const data = await fetchWithCache(SCRIPT_URL);

                const processados = data.map(v => ({
                    nome:         findVal(v, ['vinho', 'rótulo', 'nome']) || I18N.t('common.wine_no_name'),
                    produtor:     findVal(v, ['produtor', 'produtor']) || findVal(v, ['vinicola', 'vinícola', 'winery']) || I18N.t('vinicolas.unknown_producer'),
                    pais:         findVal(v, ['pais', 'país', 'origem']) || 'Outros',
                    uva:          findVal(v, ['uva', 'casta']) || 'N/A',
                    safra:        findVal(v, ['safra', 'ano', 'vintage']) || '-',
                    tipo:         findVal(v, ['tipo', 'type']) || '-',
                    regiao:       findVal(v, ['regiao', 'região', 'region']) || '-',
                    teor:         findVal(v, ['teor', 'alcool', 'álcool']) || '-',
                    classificacao:findVal(v, ['classificacao', 'class']) || '-',
                    foto:         findVal(v, ['foto', 'imagem', 'link']) || '',
                    data:         findVal(v, ['data', 'consumo', 'dia']) || '-',
                    notaF:        parseFloat(findVal(v, ['fellype', 'notaf']) || 0),
                    notaH:        parseFloat(findVal(v, ['hwlly', 'notah']) || 0),
                    artigo:       findVal(v, ['artigo']) || null,
                    artigoPublicado: findVal(v, ['publicado']) === 'SIM',
                    linha: v['_linha'] || null,
                }));

                allGroups = processados.reduce((acc, v) => {
                    const key = v.produtor.trim() || I18N.t('vinicolas.unknown_producer');
                    acc[key] = acc[key] || [];
                    acc[key].push(v);
                    return acc;
                }, {});

                sortedVinicolas = Object.keys(allGroups).sort((a, b) => allGroups[b].length - allGroups[a].length);

                render(sortedVinicolas);
            } catch (e) {
                document.getElementById('loader').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>${I18N.t('vinicolas.error').replace('\n', '<br>')}</p>
                    </div>`;
            }
        }

        function render(keys) {
            const main = document.getElementById('main-content');
            document.getElementById('loader').style.display = 'none';
            main.style.display = 'block';
            main.innerHTML = '';

            if (keys.length === 0) {
                main.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wine-bottle"></i>
                        <p>${I18N.t('vinicolas.empty')}</p>
                    </div>`;
                return;
            }

            keys.forEach(vinicola => {
                const vinhos = allGroups[vinicola];
                const notas = vinhos.filter(v => v.notaF > 0 || v.notaH > 0);
                let mediaLabel = '';
                if (notas.length > 0) {
                    const soma = notas.reduce((acc, v) => {
                        const m = (v.notaF > 0 && v.notaH > 0)
                            ? (v.notaF + v.notaH) / 2
                            : (v.notaF || v.notaH);
                        return acc + m;
                    }, 0);
                    mediaLabel = `★ ${(soma / notas.length).toFixed(1)}`;
                }

                const section = document.createElement('div');
                section.className = 'vinicola-group';
                section.dataset.vinicola = vinicola.toLowerCase();

                section.innerHTML = `
                    <div class="vinicola-header" onclick="this.parentElement.classList.toggle('active')">
                        <h2><i class="fas fa-industry"></i> ${vinicola}</h2>
                        <div class="vinicola-meta">
                            ${mediaLabel ? `<span class="vinicola-media">${mediaLabel}</span>` : ''}
                            <span class="vinicola-count">${vinhos.length}</span>
                            <i class="fas fa-chevron-down chevron"></i>
                        </div>
                    </div>
                    <div class="vinicola-content">
                        <div class="wine-grid">
                            ${vinhos.map(v => {
                                let img = v.foto || PLACEHOLDER_IMG;
                                if (img.includes('drive.google.com')) {
                                    const id = img.match(/[-\w]{25,}/);
                                    if (id) img = `https://lh3.googleusercontent.com/d/${id[0]}`;
                                }
                                const media = (v.notaF > 0 && v.notaH > 0)
                                    ? ((v.notaF + v.notaH) / 2).toFixed(1)
                                    : (v.notaF || v.notaH || '-');
                                const vinhoData = JSON.stringify(v).replace(/"/g, '&quot;');
                                return `
                                <div class="wine-card" onclick='WineModal.open(${JSON.stringify(v).replace(/'/g, "\\'")} )' title="${I18N.t('common.view_details', { nome: v.nome })}">
                                    <img src="${img}" class="wine-img" loading="lazy" onerror="this.src='${PLACEHOLDER_IMG}'" alt="${v.nome}">
                                    <div class="wine-info">
                                        <h3>${v.nome}</h3>
                                        <p><i class="fas fa-seedling" aria-hidden="true"></i> ${v.uva} <span style="opacity:.4">·</span> <i class="fas fa-globe-americas" aria-hidden="true"></i> ${I18N.translateCountry(v.pais)}</p>
                                    </div>
                                    <div class="rating-badge">${media === '-' ? '—' : '★ ' + media}</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                main.appendChild(section);
            });
        }

        // Busca por vinícola
        document.getElementById('search-vinicola').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            const filtrados = termo
                ? sortedVinicolas.filter(v => v.toLowerCase().includes(termo))
                : sortedVinicolas;
            render(filtrados);
        });

        loadVinicolas();
        window.addEventListener('i18n:change', loadVinicolas);
        /* Planilha trouxe algo novo (ex.: vinho recém-registrado): redesenha com os dados atualizados */
        window.addEventListener('adega:dados-atualizados', (e) => { if (e.detail && e.detail.url === SCRIPT_URL) loadVinicolas(); });
    </script>
</body>
</html>
